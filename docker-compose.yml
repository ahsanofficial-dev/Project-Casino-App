services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
      POSTGRES_DB: casino
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://casino:casino@postgres:5432/casino?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      API_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["3001:3001"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres_data:
